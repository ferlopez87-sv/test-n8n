services:
  - type: web
    name: n8n
    env: docker
    plan: free
    image: n8nio/n8n:latest
    envVars:
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: n8n
          property: host
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromService:
          type: psql
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_DATABASE
        fromService:
          type: psql
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromService:
          type: psql
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromService:
          type: psql
          name: n8n-db
          property: password

databases:
  - name: n8n-db
    databaseName: n8n
    user: n8n_user
    plan: free